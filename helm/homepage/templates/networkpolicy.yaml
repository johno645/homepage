{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homepage.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "homepage.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ if .Values.auth.enabled }}4180{{ else }}3000{{ end }}
{{- end }}
